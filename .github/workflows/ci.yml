name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24
          - 26
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: npm
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm ci
      - name: Validate source and packed Node behavior
        run: npm run check:code && npm test && npm run smoke:package
      - name: Enforce coverage thresholds
        if: matrix.node == 24
        run: npm run test:coverage
      - name: Install Chromium
        if: matrix.node == 24
        run: npx playwright install --with-deps --only-shell chromium
      - name: Verify packed browser compatibility
        if: matrix.node == 24
        run: npm run smoke:browser

  minimum-runtime:
    # Runtime compatibility is broader than the maintained Node lines used by repository tooling.
    name: Node 18.17 package compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: npm
          node-version: 18.17.0
      - name: Install dependencies
        run: npm ci
      - name: Verify packed Node compatibility
        run: npm run smoke:package
